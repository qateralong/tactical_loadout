modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="tactical_loadout_logo.png"
logoBlur=false
authors="qateralong"
description='''
Bullet-resistant tactical armor with working camouflage, night vision and CS2-style grenades.

- 15 sets: CS2 CT and T, US Woodland, Desert, OD Green, MultiCam, Snow, UCP and Tiger Stripe, Russian Ratnik (EMR) and Flora, ghillie suits and SWAT.
- Light, medium and heavy tiers with per-zone protection against bullets and other projectiles.
- Camouflage that hides you from mobs, stronger in matching biomes and while sneaking.
- Helmet-mounted PVS-14, GPNVG-18 and thermal imagers, plus a gas mask.
- Every CS2 grenade plus a frag: HE, flashbang, smoke, molotov, incendiary and decoy, with a hold-to-charge throw.
- Armor repair kits for the anvil, grenade-throwing dispensers, advancements and loot in outposts, dungeons and ancient cities.

Works on its own; TaCZ adds exact headshot detection and armor-piercing ammo support.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tacz"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="NONE"
    side="BOTH"

[[mixins]]
    config="${mod_id}.mixins.json"
